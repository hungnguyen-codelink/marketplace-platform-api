task_id: 5.2
task_name: "Orders & Checkout Frontend"

implementation_scope:
  components:
    - "Cart page (frontend/src/pages/buyer/Cart.tsx)"
    - "Checkout form (frontend/src/pages/buyer/Checkout.tsx)"
    - "Checkout success page (frontend/src/pages/buyer/CheckoutSuccess.tsx)"
    - "Order history page (frontend/src/pages/buyer/OrderHistory.tsx)"
    - "Order detail page with ProgressStepper (frontend/src/pages/buyer/OrderDetail.tsx)"
    - "Seller orders list with status filter tabs (frontend/src/pages/seller/SellerOrders.tsx)"
    - "Seller order detail with next-state button only (frontend/src/pages/seller/SellerOrderDetail.tsx)"
    - "Orders API module (frontend/src/api/orders.ts)"
    - "Cart API module (frontend/src/api/cart.ts)"
    - "Cart unit tests (frontend/src/pages/buyer/Cart.test.tsx)"
    - "Checkout unit tests (frontend/src/pages/buyer/Checkout.test.tsx)"
    - "CheckoutSuccess unit tests (frontend/src/pages/buyer/CheckoutSuccess.test.tsx)"
    - "OrderHistory unit tests (frontend/src/pages/buyer/OrderHistory.test.tsx)"
    - "OrderDetail unit tests (frontend/src/pages/buyer/OrderDetail.test.tsx)"
    - "SellerOrders unit tests (frontend/src/pages/seller/SellerOrders.test.tsx)"
    - "SellerOrderDetail unit tests (frontend/src/pages/seller/SellerOrderDetail.test.tsx)"
    - "Orders API module tests (frontend/src/api/orders.test.ts)"
    - "Cart API module tests (frontend/src/api/cart.test.ts)"

  integration_surfaces:
    - "CartContext: useCart() hook (addItem, removeItem, updateQty, clearCart, cart, isLoading)"
    - "ToastContext: useToast() for notifications"
    - "AuthContext: useAuth() for user/role checks"
    - "Backend endpoints: POST /api/orders/checkout, GET /api/orders, GET /api/orders/:id, GET /api/seller/orders, GET /api/seller/orders/:id, PATCH /api/seller/orders/:id/status"
    - "ProgressStepper component: renders order lifecycle"
    - "StatusBadge component: colored status badge"

test_contract:
  tiers_required: [unit]
  rationale: "Unit tests with mocked API and context providers validate all component behavior. No DB/Redis boundaries crossed."

  unit:
    commands:
      - "npm run test -w frontend -- src/pages/buyer/Cart.test.tsx"
      - "npm run test -w frontend -- src/pages/buyer/Checkout.test.tsx"
      - "npm run test -w frontend -- src/pages/buyer/CheckoutSuccess.test.tsx"
      - "npm run test -w frontend -- src/pages/buyer/OrderHistory.test.tsx"
      - "npm run test -w frontend -- src/pages/buyer/OrderDetail.test.tsx"
      - "npm run test -w frontend -- src/pages/seller/SellerOrders.test.tsx"
      - "npm run test -w frontend -- src/pages/seller/SellerOrderDetail.test.tsx"
      - "npm run test -w frontend -- src/api/orders.test.ts"
      - "npm run test -w frontend -- src/api/cart.test.ts"

    must_cover:
      - "[Cart] Displays cart items with product image, title, price, quantity controls"
      - "[Cart] Shows empty state when cart.items.length === 0"
      - "[Cart] Displays order total (sum of item price × quantity)"
      - "[Cart] 'Proceed to Checkout' button navigates to /checkout"
      - "[Cart] Quantity increment calls updateQty via useCart()"
      - "[Cart] Quantity decrement calls updateQty via useCart()"
      - "[Cart] Remove item button calls removeItem via useCart()"
      - "[Cart] Shows loading spinner while isLoading is true"
      - "[Checkout] Renders form with street, city, state, zip, country fields"
      - "[Checkout] Shows mock payment notice"
      - "[Checkout] Form validation: each field required, shows field errors"
      - "[Checkout] On submit, calls checkout API with shipping_address payload"
      - "[Checkout] On success, navigates to /checkout/success"
      - "[Checkout] On API failure, shows error toast"
      - "[Checkout] On API failure, does NOT call useCart().clearCart() (AC-UI-05)"
      - "[Checkout] On API failure, cart items remain in CartContext"
      - "[Checkout] On API failure, preserves all form field values"
      - "[Checkout] Submit button disabled while API call pending"
      - "[CheckoutSuccess] Displays order ID"
      - "[CheckoutSuccess] Shows link to /orders"
      - "[CheckoutSuccess] Shows confirmation message"
      - "[OrderHistory] Fetches orders on mount"
      - "[OrderHistory] Shows loading spinner while fetching"
      - "[OrderHistory] Displays list with status badge, date, total, item count"
      - "[OrderHistory] Order rows navigate to /orders/:id"
      - "[OrderHistory] Pagination controls"
      - "[OrderHistory] Empty state for no orders"
      - "[OrderDetail] Fetches order by ID on mount"
      - "[OrderDetail] Shows loading spinner"
      - "[OrderDetail] If 404, displays not-found state or navigates to /orders"
      - "[OrderDetail] Shows ProgressStepper with current status"
      - "[OrderDetail] Displays order items with product title, quantity, unit price"
      - "[OrderDetail] Displays shipping address"
      - "[OrderDetail] Shows order metadata (ID, date, total)"
      - "[SellerOrders] Fetches orders on mount"
      - "[SellerOrders] Shows loading spinner"
      - "[SellerOrders] Renders status filter tabs (All, pending, confirmed, shipped, delivered, completed)"
      - "[SellerOrders] All tab selected by default"
      - "[SellerOrders] Clicking status tab calls API with ?status= param"
      - "[SellerOrders] Displays orders table with ID, date, total, status"
      - "[SellerOrders] Order rows navigate to /seller/orders/:id"
      - "[SellerOrders] Empty state for no orders"
      - "[SellerOrderDetail] Fetches order on mount"
      - "[SellerOrderDetail] Shows loading spinner"
      - "[SellerOrderDetail] Shows ProgressStepper"
      - "[SellerOrderDetail] If status 'pending': shows button 'Confirm Order'"
      - "[SellerOrderDetail] If status 'confirmed': shows button 'Mark as Shipped'"
      - "[SellerOrderDetail] If status 'shipped': shows button 'Mark as Delivered'"
      - "[SellerOrderDetail] If status 'delivered': shows button 'Mark as Completed'"
      - "[SellerOrderDetail] If status 'completed': shows no next-state button (AC-UI-08)"
      - "[SellerOrderDetail] Does NOT render any dropdown/select for status (AC-UI-08)"
      - "[SellerOrderDetail] Next-state button calls PATCH with correct new status"
      - "[SellerOrderDetail] Button disabled while API pending"
      - "[SellerOrderDetail] Success toast on update"
      - "[SellerOrderDetail] Displays order items and shipping address"
      - "[ordersApi.checkout] POSTs to /api/orders/checkout with shipping_address"
      - "[ordersApi.getOrders] GETs /api/orders with page/limit params"
      - "[ordersApi.getOrder] GETs /api/orders/:id"
      - "[ordersApi.getSellerOrders] GETs /api/seller/orders with optional status param"
      - "[ordersApi.getSellerOrder] GETs /api/seller/orders/:id"
      - "[ordersApi.updateSellerOrderStatus] PATCHes /api/seller/orders/:id/status"
      - "[cartApi.getCart] GETs /api/cart"
      - "[cartApi.addItem] POSTs to /api/cart/items"
      - "[cartApi.removeItem] DELETEs /api/cart/items/:productId"
      - "[cartApi.updateQty] PUTs /api/cart/items/:productId"
      - "[cartApi.clearCart] DELETEs /api/cart"

acceptance_criteria:
  unit: all pass
  no_regression: true
  ac_verified:
    - "AC-UI-05: Checkout payment failure shows error AND does not clear cart"
    - "AC-UI-08: Seller order detail shows only next-state button, no dropdown"

sign_off:
  coding_agent: ✅
  testing_agent: ✅
